services:
  - type: web
    name: miniupwork-rum-demo
    runtime: python
    plan: free
    rootDir: MiniUpwork_Nhom_Rum
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn miniupwork.phase4:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MINIUPWORK_WEB_URL
        value: https://ly-dat-nt.github.io/MiniUpWork/
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
